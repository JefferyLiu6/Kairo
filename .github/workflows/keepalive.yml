name: Backend health check

# The backend runs on an Oracle Cloud VM that never sleeps (docs/DEPLOY_ORACLE.md).
# This checks /health every hour, so a failed run (and GitHub's email about it)
# says the backend is down.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check backend health endpoint
        run: |
          curl -fsS --max-time 30 --retry 2 --retry-delay 5 \
            -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://40-233-90-252.sslip.io/health
